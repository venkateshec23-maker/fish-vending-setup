; PlatformIO Configuration for Smart Fish Vending Machine ESP32
; Install PlatformIO: pip install platformio

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Dependencies
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    knolleary/PubSubClient@^2.8

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DWIFI_SSID=\"${env:WIFI_SSID}\"
    -DWIFI_PASSWORD=\"${env:WIFI_PASSWORD}\"

; Monitor options
monitor_filters = esp32_exception_decoder
